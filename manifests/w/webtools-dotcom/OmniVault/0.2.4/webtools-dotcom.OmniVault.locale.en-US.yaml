ShortDescription: Local-first vault for notes, links and screenshots that syncs between your own devices over Wi-Fi.
Description: |-
  OmniVault keeps notes, links, screenshots and files in nested folders. Every device holds a complete copy,
  and devices on the same network find each other and sync peer to peer. There is no server and no account.
  The Android app and any browser on the same network can connect to it.
